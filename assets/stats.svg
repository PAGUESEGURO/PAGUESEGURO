<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#131622"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="28" y="128" width="439" height="9" rx="4.5"/>
    </clipPath>
  </defs>

  <rect width="495" height="195" rx="6" fill="url(#cardBg)" stroke="#292e42" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="34" fill="#70a5fd" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.4">STACK &amp; ECOSYSTEM OVERVIEW</text>
  <g transform="translate(348, 20)">
    <rect x="0" y="0" width="119" height="20" rx="10" fill="#132a2e" stroke="#1f4d52" stroke-width="1"/>
    <circle cx="12" cy="10" r="3.2" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="13.5" fill="#38bdae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">PRODUÇÃO ATIVA</text>
  </g>

  <line x1="28" y1="48" x2="467" y2="48" stroke="#292e42" stroke-width="1"/>

  <!-- Metrics columns -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="96" y="84" fill="#38bdf8" font-size="23" font-weight="800">12+</text>
    <text x="96" y="103" fill="#a9b1d6" font-size="11" font-weight="600">Plataformas no Ar</text>

    <line x1="170" y1="62" x2="170" y2="108" stroke="#292e42" stroke-width="1"/>

    <text x="247" y="84" fill="#2dd4bf" font-size="23" font-weight="800">99.98%</text>
    <text x="247" y="103" fill="#a9b1d6" font-size="11" font-weight="600">Uptime Monitorado</text>

    <line x1="324" y1="62" x2="324" y2="108" stroke="#292e42" stroke-width="1"/>

    <text x="398" y="84" fill="#bf91f3" font-size="23" font-weight="800">Brasil</text>
    <text x="398" y="103" fill="#a9b1d6" font-size="11" font-weight="600">25+ Techs Ativas</text>
  </g>

  <!-- Stacked stack bar -->
  <rect x="28" y="128" width="439" height="9" rx="4.5" fill="#24283b"/>
  <g clip-path="url(#barClip)">
    <rect x="28" y="128" width="202" height="9" fill="#38bdf8"/>
    <rect x="230" y="128" width="97" height="9" fill="#2dd4bf"/>
    <rect x="327" y="128" width="79" height="9" fill="#a78bfa"/>
    <rect x="406" y="128" width="61" height="9" fill="#10b981"/>
  </g>

  <!-- Legend 2x2 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" fill="#c0caf5">
    <circle cx="33" cy="155" r="4" fill="#38bdf8"/>
    <text x="43" y="158.5">TypeScript / Next.js <tspan fill="#70a5fd" font-weight="700">46%</tspan></text>

    <circle cx="256" cy="155" r="4" fill="#2dd4bf"/>
    <text x="266" y="158.5">React / UI &amp; 3D <tspan fill="#38bdae" font-weight="700">22%</tspan></text>

    <circle cx="33" cy="175" r="4" fill="#a78bfa"/>
    <text x="43" y="178.5">Python / IA &amp; OSINT <tspan fill="#bf91f3" font-weight="700">18%</tspan></text>

    <circle cx="256" cy="175" r="4" fill="#10b981"/>
    <text x="266" y="178.5">Supabase / SQL / Prisma <tspan fill="#34d399" font-weight="700">14%</tspan></text>
  </g>
</svg>
